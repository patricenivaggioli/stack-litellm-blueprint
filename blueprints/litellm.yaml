spec_version: 2
description: Deploy a LiteLLM proxy on London Lab OCPAI-02 with selectable providers, optional Cisco AI Defense, and optional Galileo logging.
instructions:
  text: |
    Select the Torque agent connected to London Lab OCPAI-02.
    Create the target namespace and a litellm-credentials Secret there before launch.
    Add only the credential keys required by the selected options.
    The chart creates an HTTPS OpenShift Route at the selected host and shows its URL after launch.
    A fixed host can be claimed by only one active deployment at a time.
    Cisco AI Defense requires an enabled policy attached to the API-key connection.
    Galileo defaults to the liteLLM gateway project and litellm-requests log stream;
    override their IDs if you want another destination.
metadata:
  display-name: LiteLLM gateway - London Lab
  self-service: [AI-Services]
customization:
  launch-form:
    inputs:
      - name: agent
      - name: namespace
      - name: route_host
      - name: providers
      - name: ai_defense
      - name: ai_defense_api_base
        visible: '{% if inputs.ai_defense == "yes" %}true{% else %}false{% endif %}'
      - name: observability
      - name: galileo_project_id
        visible: '{% if inputs.observability == "yes" %}true{% else %}false{% endif %}'
      - name: galileo_log_stream_id
        visible: '{% if inputs.observability == "yes" %}true{% else %}false{% endif %}'
      - name: galileo_base_url
        visible: '{% if inputs.observability == "yes" %}true{% else %}false{% endif %}'
      - name: credentials_secret
      - name: image_tag
      - name: openai_model
      - name: mistral_model
      - name: anthropic_model
      - name: local_kind
      - name: local_model
      - name: local_api_base
inputs:
  agent:
    type: agent
    description: Torque agent connected to OCPAI-02 in the London Lab.
  namespace:
    type: string
    default: litellm
    description: Kubernetes namespace for this deployment; created if absent.
    pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
  route_host:
    type: string
    default: litellm-litellm.apps.ocpai-02.emea-geo-lab.com
    description: Fixed OpenShift Route host. Use the same value across replacement deployments; only one active Route may claim it.
  providers:
    type: string
    style: multi-select
    default: '["Mistral"]'
    allowed-values: [Mistral, OpenAI, Anthropic, Local]
    description: One or more upstream model providers. At least one is required.
  ai_defense:
    type: string
    style: radio
    default: 'yes'
    allowed-values: ['yes', 'no']
    description: Enable Cisco AI Defense for request and response inspection.
  observability:
    type: string
    style: radio
    default: 'yes'
    allowed-values: ['yes', 'no']
    description: Send LiteLLM request logs to Galileo.
  credentials_secret:
    type: string
    default: litellm-credentials
    description: Existing Kubernetes Secret containing the master key and keys for selected providers.
  image_tag:
    type: string
    default: v1.108.0
    description: Pinned LiteLLM container image tag.
  openai_model:
    type: string
    default: gpt-4o-mini
    description: OpenAI model ID, used when OpenAI is selected.
  mistral_model:
    type: string
    default: mistral-small-latest
    description: Mistral model ID, used when Mistral is selected.
  anthropic_model:
    type: string
    default: claude-sonnet-4-5
    description: Anthropic model ID, used when Anthropic is selected.
  local_kind:
    type: string
    style: radio
    default: ollama
    allowed-values: [ollama, openai-compatible]
    description: Protocol used by the local model endpoint.
  local_model:
    type: string
    default: llama3.2
    description: Model ID served by the local endpoint.
  local_api_base:
    type: string
    default: http://ollama:11434
    description: Reachable local model API base URL; include /v1 for OpenAI-compatible servers.
  ai_defense_api_base:
    type: string
    default: https://us.api.inspect.aidefense.security.cisco.com
    description: Cisco AI Defense regional API base URL.
  galileo_project_id:
    type: string
    default: c31f19d9-d20d-44f8-bd8b-3c361f71db7b
    description: Galileo project ID, required when observability is enabled.
  galileo_log_stream_id:
    type: string
    default: ffc69b3a-b792-4907-b331-64ddf162af5d
    description: Optional Galileo log stream ID.
  galileo_base_url:
    type: string
    default: https://api.galileo.ai
    description: Galileo Cloud API URL.
outputs:
  service_url:
    value: 'http://litellm-{{ envId | downcase }}.{{ .inputs.namespace }}.svc.cluster.local:4000'
  route_url:
    value: '{{ .grains.litellm.scripts.post-helm-install.outputs.route_url }}'
    kind: link
    quick: true
grains:
  litellm:
    kind: helm
    spec:
      source:
        store: stack-litellm-blueprint
        path: helm/litellm
      agent:
        name: '{{ .inputs.agent }}'
      target-namespace: '{{ .inputs.namespace }}'
      command-arguments: '--create-namespace --wait --timeout 10m'
      scripts:
        post-helm-install:
          source:
            store: stack-litellm-blueprint
            path: scripts/get-route-url.sh
          arguments: 'litellm-{{ envId | downcase }} {{ .inputs.namespace }}'
          outputs:
            - route_url
      inputs:
        - fullnameOverride: 'litellm-{{ envId | downcase }}'
        - route.host: '{{ .inputs.route_host }}'
        - image.tag: '{{ .inputs.image_tag }}'
        - secretName: '{{ .inputs.credentials_secret }}'
        - providers.openai.enabled: '{% if .inputs.providers contains "OpenAI" %}true{% else %}false{% endif %}'
        - providers.openai.model: '{{ .inputs.openai_model }}'
        - providers.mistral.enabled: '{% if .inputs.providers contains "Mistral" %}true{% else %}false{% endif %}'
        - providers.mistral.model: '{{ .inputs.mistral_model }}'
        - providers.anthropic.enabled: '{% if .inputs.providers contains "Anthropic" %}true{% else %}false{% endif %}'
        - providers.anthropic.model: '{{ .inputs.anthropic_model }}'
        - providers.local.enabled: '{% if .inputs.providers contains "Local" %}true{% else %}false{% endif %}'
        - providers.local.kind: '{{ .inputs.local_kind }}'
        - providers.local.model: '{{ .inputs.local_model }}'
        - providers.local.apiBase: '{{ .inputs.local_api_base }}'
        - aiDefense.enabled: '{% if .inputs.ai_defense == "yes" %}true{% else %}false{% endif %}'
        - aiDefense.apiBase: '{{ .inputs.ai_defense_api_base }}'
        - observability.enabled: '{% if .inputs.observability == "yes" %}true{% else %}false{% endif %}'
        - observability.galileoProjectId: '{{ .inputs.galileo_project_id }}'
        - observability.galileoLogStreamId: '{{ .inputs.galileo_log_stream_id }}'
        - observability.galileoBaseUrl: '{{ .inputs.galileo_base_url }}'
